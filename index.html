<style>

    --bg:#0f1411; --surface:#18211c; --surface2:#1f2a23; --surface3:#26332b;
    --border:#2c3a31; --text:#e8efe9; --text2:#aab8af; --text3:#6f7d74;

// REST helpers (anon key). Portal can only touch the safe view, portal_login RPC, and insert bookings.
async function sbGet(path){
  const r = await fetch(`${SB_URL}/rest/v1/${path}`,{headers:{apikey:SB_KEY,Authorization:'Bearer '+SB_KEY}});
  if(!r.ok) throw new Error('Read failed ('+r.status+')');
  return r.json();
}
async function sbRpc(fn, body){
  const r = await fetch(`${SB_URL}/rest/v1/rpc/${fn}`,{method:'POST',headers:{apikey:SB_KEY,Authorization:'Bearer '+SB_KEY,'Content-Type':'application/json'},body:JSON.stringify(body)});
  if(!r.ok){ let t=''; try{ t=await r.text(); }catch(_){}; throw new Error(`${fn} failed (${r.status})${t?': '+t.slice(0,140):''}`); }
  return r.json();
}
async function sbInsert(table, row){
  const r = await fetch(`${SB_URL}/rest/v1/${table}`,{method:'POST',headers:{apikey:SB_KEY,Authorization:'Bearer '+SB_KEY,'Content-Type':'application/json',Prefer:'return=minimal'},body:JSON.stringify(row)});
  if(!r.ok){ const t=await r.text(); throw new Error('Save failed: '+t); }
  return true;
}

// ── Referral commission (for clients who refer others) ────────────────────
// qty → kg / pieces, matching the admin app exactly.
function _cmKg(r){ const q=parseFloat(r.qty)||0, t=(r.qty_type||'bundles').toLowerCase();
  const bw=parseFloat(r.bundle_wt)||0, pw=parseFloat(r.packet_wt)||0, spp=parseFloat(r.sheets_per_packet)||1;
  if(t==='bundles')return q*bw; if(t==='packets')return q*pw; if(t==='sheets')return (q/spp)*pw; if(t==='kg')return q; if(t==='mt')return q*1000; return q*bw; }
function _cmPcs(r){ const q=parseFloat(r.qty)||0, t=(r.qty_type||'bundles').toLowerCase();
  const np=parseFloat(r.num_packets)||1, spp=parseFloat(r.sheets_per_packet)||1, pw=parseFloat(r.packet_wt)||0;
  if(t==='packets'||t==='pcs'||t==='reams')return q; if(t==='bundles')return q*np; if(t==='sheets')return q/spp; if(t==='kg')return pw?q/pw:0; if(t==='mt')return pw?(q*1000)/pw:0; return q*np; }
async function loadCommission(){
  COMMISSION=null;
  let rows=[];
  try{ rows = await sbRpc('portal_my_commission',{p_username:CLIENT.u, p_password:CLIENT.p}) || []; }
  catch(e){ return; }   // RPC not installed yet, or none — simply no tab
  if(!rows.length) return;
  const agg={};
  rows.forEach(r=>{
    const unit = (r.incentive_unit==='pcs') ? 'pcs' : 'kg';
    const vol  = unit==='pcs' ? _cmPcs(r) : _cmKg(r);
    const key  = (r.client_name||'-') + '|' + (r.product_name||'-');
    if(!agg[key]) agg[key] = { client:r.client_name||'-', product:r.product_name||'-', unit, diff:parseFloat(r.diff_rate)||0, cut:parseFloat(r.cut_pct)||0, vol:0 };
    agg[key].vol += (vol||0);
  });
  let total=0; const byClient={};
  Object.values(agg).forEach(a=>{
    const gross=a.diff*a.vol; a.commission=gross*(1-(a.cut||0)/100); total+=a.commission;
    (byClient[a.client]=byClient[a.client]||[]).push(a);
  });
  if(total<=0){ COMMISSION=null; return; }
  // redemption history → paid / pending / available
  let reds=[], paid=0, reserved=0, pendingExists=false;
  try{ reds = await sbRpc('portal_my_redemptions',{p_username:CLIENT.u, p_password:CLIENT.p}) || []; }catch(_){}
  reds.forEach(r=>{
    if(r.status==='paid') paid += (parseFloat(r.paid_amount)||parseFloat(r.requested_amount)||0);
    else if(r.status==='requested'){ reserved += parseFloat(r.requested_amount)||0; pendingExists=true; }
  });
  const available = Math.max(0, total - paid - reserved);
  COMMISSION={ byClient, total, redemptions:reds, paid, available, pendingExists };
}
function _inr(n){ return '₹'+Math.round(n||0).toLocaleString('en-IN'); }

// Global: hide actual stock numbers from clients (show Available/Not only).
// Later this can be driven per-client from the server.
const HIDE_STOCK_QTY = true;

async function loadStock(){
  try{ STOCK = await sbRpc('portal_stock',{p_username:CLIENT.u, p_password:CLIENT.p}) || []; window._stockErr=''; }
  catch(e){ STOCK=[]; window._stockErr = e.message || 'Unknown error'; toast('Could not load stock'); }
}

function isAvail(s){ return s.bundles_avail==null ? (s.free_kg>0) : (s.bundles_avail>0); }
function qtyLabel(s){
  if(HIDE_STOCK_QTY) return isAvail(s) ? 'Available' : 'Not available';
  if(s.bundles_avail==null) return Math.round(s.free_kg)+' kg';
  return s.bundles_avail>0 ? s.bundles_avail+' bundles' : 'Out of stock';
}

function stockRowsHtml(items){
  const groups={};
  items.forEach(s=>{ const g=s.category||'Other'; (groups[g]=groups[g]||[]).push(s); });
  let list='';
  Object.keys(groups).sort().forEach(g=>{
    list+=`<div class="group-h">${g}</div>`;
    groups[g].forEach(s=>{
      const avail=isAvail(s);
      const sub=[s.size,s.gsm?s.gsm+' GSM':'',s.color].filter(Boolean).join(' • ');
      list+=`<div class="prod ${avail?'':'prod-out'}">
        <div><div class="prod-name">${s.name}</div>
        <div class="prod-sub">${sub||'&nbsp;'}</div>
        <div class="prod-qty">${avail?'✔ Available':'Not available'}</div></div>
        <button class="book-btn" onclick='openBook(${JSON.stringify(s).replace(/'/g,"&#39;")})'>Request</button>
      </div>`;
    });
  });
  return list;
}

async function renderHome(){
  $('app').innerHTML = _topbarHtml() + _tabsHtml() + '<div class="content" id="home-c"></div>';
  _activateTab('Home');
  const c=$('home-c'); if(!c) return;
  const hr=new Date().getHours();
  const greet = hr<12?'Good morning':hr<17?'Good afternoon':'Good evening';

    <div id="home-stock"><div class="empty"><span class="spin" style="border-top-color:var(--green)"></span></div></div>`;
  // pull delivered orders (what they hold) + open requests
  let orders=[], bookings=[];
  try{ orders  = await sbRpc('portal_my_orders',  {p_username:CLIENT.u,p_password:CLIENT.p}) || []; }catch(_){}
  try{ bookings= await sbRpc('portal_my_bookings',{p_username:CLIENT.u,p_password:CLIENT.p}) || []; }catch(_){}
  // aggregate delivered material by product + unit
  const agg={};
  orders.forEach(o=>{ const name=o.product_name||'-', u=(o.qty_type||'').toLowerCase();
    const key=name+'|'+u; if(!agg[key]) agg[key]={name,unit:u,qty:0}; agg[key].qty+=parseFloat(o.qty)||0; });
  const rows=Object.values(agg).filter(r=>r.qty>0).sort((a,b)=>a.name.localeCompare(b.name));
  // tiles
  const openReq = bookings.filter(b=>b.status==='requested'||b.status==='available').length;
  const tiles=[];
  tiles.push(`<div class="tile"><div class="tile-v">${rows.length}</div><div class="tile-l">Products with you</div></div>`);
  tiles.push(`<div class="tile"><div class="tile-v">${openReq}</div><div class="tile-l">Open requests</div></div>`);

  const tEl=$('home-tiles'); if(tEl) tEl.innerHTML=tiles.join('');
  // stock-with-you list
  const sEl=$('home-stock'); if(sEl){
    sEl.innerHTML = rows.length ? rows.map(r=>`
      <div class="hrow"><div><div class="hrow-name">${r.name}</div><div class="hrow-sub">Received from us</div></div>
        <div class="hrow-qty">${(Math.round(r.qty*100)/100)} ${r.unit||''}</div></div>`).join('')

  }
}

function _qtProdOpts(){ return '<option value="">Select product...</option>'+QT_PRODUCTS.map(p=>`<option value="${(p.product_name||'').replace(/"/g,'&quot;')}">${p.product_name||'-'}</option>`).join(''); }
function qtAddRow(){

function _qtRows(){ return Array.from(document.querySelectorAll('.qt-row')).map(r=>({

function qtRecalc(){

  const fwd=parseFloat(($('qt-fwd')||{}).value)||0, gst=parseFloat(($('qt-gst')||{}).value)||0;

function qtGeneratePdf(){

  let sub=0; const lines=rows.map(r=>{ const amt=r.qty*r.rate; sub+=amt;
    return `<tr><td>${r.product}</td><td style="text-align:right">${r.qty} ${r.unit}</td><td style="text-align:right">₹${r.rate}</td><td style="text-align:right">${inr(amt)}</td></tr>`; }).join('');
  const taxable=sub+fwd, gstAmt=taxable*gst/100, total=taxable+gstAmt;

    *{font-family:Arial,Helvetica,sans-serif;box-sizing:border-box} body{margin:0;padding:24px;color:#111}

    .meta{margin:12px 0;font-size:13px;color:#333;line-height:1.6} table{width:100%;border-collapse:collapse;margin-top:12px;font-size:13px}
    th,td{border:1px solid #bbb;padding:7px 9px} th{background:#f0f7f2;text-align:left}
    .tot{margin-top:14px;max-width:290px;margin-left:auto;font-size:13px}
    .tot div{display:flex;justify-content:space-between;padding:4px 0} .tot .g{font-weight:800;font-size:16px;border-top:2px solid #166534;padding-top:8px;color:#166534}
    .ft{margin-top:28px;font-size:11px;color:#999}
    @media print{body{padding:4px}}
  </style></head><body>
    <div class="h"><div class="seller">${CLIENT.name||''}</div><div class="doc">QUOTATION</div></div>
    <div class="meta"><b>Quote for:</b> ${cust}${phone?' · '+phone:''}<br><b>Date:</b> ${fmtDate}</div>
    <table><thead><tr><th>Product</th><th style="text-align:right">Qty</th><th style="text-align:right">Rate</th><th style="text-align:right">Amount</th></tr></thead><tbody>${lines}</tbody></table>
    <div class="tot">
      <div><span>Subtotal</span><span>${inr(sub)}</span></div>
      ${fwd?`<div><span>Forwarding</span><span>${inr(fwd)}</span></div>`:''}
      ${gst?`<div><span>GST ${gst}%</span><span>${inr(gstAmt)}</span></div>`:''}
      <div class="g"><span>Total</span><span>${inr(total)}</span></div>
    </div>
    <div class="ft">Generated via K N Papers client portal</div>
  </body></html>`;
  const w=window.open('','_blank');
  if(!w){ toast('Allow pop-ups to open the quote'); return; }
  w.document.open(); w.document.write(html); w.document.close();
  // trigger the print/save dialog from here (no inline script in the doc)
  setTimeout(function(){ try{ w.focus(); w.print(); }catch(e){} }, 450);
}

// What this reseller owes their clients' mechanics/referrers on approved resale distributions.
async function loadMechDues(){
  const el=$('ds-dues'); if(!el) return;
  let rows=[];
  try{ rows = await sbRpc('portal_mechanic_dues',{p_username:CLIENT.u,p_password:CLIENT.p}) || []; }catch(_){ el.innerHTML=''; return; }
  if(!rows.length){ el.innerHTML=''; return; }
  const agg={}; let total=0;
  rows.forEach(r=>{
    const unit=(r.incentive_unit==='pcs')?'pcs':'kg';
    const vol=unit==='pcs'?_cmPcs(r):_cmKg(r);
    const rate=parseFloat(r.rate)||0, cut=parseFloat(r.cut_pct)||0;
    const amt=rate*vol*(1-cut/100);
    const k=r.payee_name||'-';
    agg[k]=(agg[k]||0)+amt; total+=amt;
  });
  if(total<=0){ el.innerHTML=''; return; }
  const lines=Object.keys(agg).sort().map(k=>`
    <div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--border)">
      <span>🔧 ${k}</span><span style="font-weight:700">${_inr(agg[k])}</span></div>`).join('');
  el.innerHTML=`
    <div style="background:rgba(245,158,11,.12);border:1px solid var(--amber);border-radius:12px;padding:14px;margin-bottom:14px">
      <div style="font-weight:700;margin-bottom:2px">You owe your clients' mechanics</div>
      <div style="font-size:12px;color:var(--text3);margin-bottom:10px">Commission on material you resold to clients who have a mechanic. Payable by you.</div>
      ${lines}
      <div style="display:flex;justify-content:space-between;padding-top:10px;font-weight:800;font-size:15px"><span>Total you owe</span><span style="color:var(--amber)">${_inr(total)}</span></div>
    </div>`;
}
async function loadDistHistory(){
  const el=$('ds-history'); if(!el) return;
  let rows=[];
  try{ rows = await sbRpc('portal_my_distributions',{p_username:CLIENT.u,p_password:CLIENT.p}) || []; }catch(_){}
  if(!rows.length){ el.innerHTML='<div class="empty">No distributions logged yet.</div>'; return; }
  const fmt=d=>{ if(!d)return''; const t=new Date(d); return isNaN(t)?d:t.toLocaleDateString('en-IN',{day:'numeric',month:'short'}); };
  const pill=s=> s==='Delivered'?'<span class="pill pill-green">APPROVED ✓</span>': s==='Cancelled'?'<span class="pill pill-red">REJECTED</span>':'<span class="pill pill-amber">IN REVIEW</span>';
  el.innerHTML='<div class="group-h">Your logged distributions</div>'+rows.map(r=>`
    <div class="booking">${pill(r.status)}
      <div class="b-prod">${r.product_name||'-'} → ${r.end_client_name||'-'}</div>
      <div class="b-meta">${r.qty} ${r.qty_type||''} • ${fmt(r.order_date)}</div>
    </div>`).join('');
}
async function submitDistribution(){
  const cid=$('ds-client').value, pid=$('ds-prod').value, qty=parseFloat($('ds-qty').value), unit=$('ds-unit').value;
  if(!cid){ toast('Pick a client'); return; }
  if(!pid){ toast('Pick a product'); return; }
  if(!qty||qty<=0){ toast('Enter a quantity'); return; }
  const btn=$('ds-btn'); btn.disabled=true; btn.innerHTML='<span class="spin"></span>';
  try{
    await sbRpc('portal_log_distribution',{p_username:CLIENT.u,p_password:CLIENT.p,p_end_client:cid,p_product:pid,p_qty:qty,p_qty_type:unit});
    toast('Submitted for review');
    $('ds-qty').value='';
    loadDistHistory();
  }catch(e){ toast(e.message); btn.disabled=false; btn.textContent='Submit for review'; return; }
  btn.disabled=false; btn.textContent='Submit for review';
}

// "My Requests" — requested → available (Book) → booked. Status-aware.
async function showMyBookings(){
  _activateTab("Requests");
  const box=$('app').querySelector('.content');
  box.innerHTML='<div class="empty"><span class="spin" style="border-top-color:var(--green)"></span></div>';
  let rows=[];
  try{ rows = await sbRpc('portal_my_bookings',{p_username:CLIENT.u, p_password:CLIENT.p}) || []; }
  catch(e){ box.innerHTML='<div class="empty">Could not load your requests.<br><br><span style="color:var(--text3);font-size:11px">'+(e.message||'Unknown error')+'</span></div>'; return; }
  if(!rows.length){ box.innerHTML='<div class="empty">No requests yet.<br><br>Find material on the Stock tab and tap Request.</div>'; return; }
  const when = ts => { const d=new Date(ts); return d.toLocaleDateString('en-IN',{day:'numeric',month:'short'})+', '+d.toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'}); };
  const pill = s =>
    s==='available' ? '<span class="pill pill-green">AVAILABLE ✓</span>' :
    s==='booked'    ? '<span class="pill pill-green">BOOKED ✓</span>' :
    s==='ordered'   ? '<span class="pill pill-green">IN PROCESS</span>' :
    s==='rejected'  ? '<span class="pill pill-red">NOT AVAILABLE</span>' :
                      '<span class="pill pill-amber">WAITING</span>';
  box.innerHTML = rows.map(b=>`
    <div class="booking ${b.status==='available'||b.status==='booked'||b.status==='ordered'?'confirmed':b.status==='rejected'?'rejected':''}">
      ${pill(b.status)}
      <div class="b-prod">${b.product_name||'-'}</div>
      <div class="b-meta">${b.qty} ${b.qty_type||''} • ${when(b.created_at)}${b.note?' • '+b.note:''}</div>
      ${b.status==='available' ? `<button class="btn" style="margin-top:8px;width:100%" onclick="bookConfirmed('${b.id}')">📦 Book now</button>` : ''}
    </div>`).join('');
}

// "My Orders" — sales orders delivered to this client.
async function showMyOrders(){
  _activateTab("Orders");
  const box=$('app').querySelector('.content');
  box.innerHTML='<div class="empty"><span class="spin" style="border-top-color:var(--green)"></span></div>';
  let rows=[];
  try{ rows = await sbRpc('portal_my_orders',{p_username:CLIENT.u, p_password:CLIENT.p}) || []; }
  catch(e){ box.innerHTML='<div class="empty">Could not load your orders.<br><br><span style="color:var(--text3);font-size:11px">'+(e.message||'Unknown error')+'</span></div>'; return; }
  if(!rows.length){ box.innerHTML='<div class="empty">No delivered orders yet.</div>'; return; }
  const fmt = d => { if(!d) return ''; const t=new Date(d); return isNaN(t)?d:t.toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'}); };
  // group by delivered_date
  const groups={};
  rows.forEach(o=>{ const k=o.delivered_date||o.order_date||'—'; (groups[k]=groups[k]||[]).push(o); });
  let html='';
  Object.keys(groups).sort((a,b)=>b.localeCompare(a)).forEach(k=>{
    html+=`<div class="group-h">📦 Delivered ${fmt(k)}</div>`;
    groups[k].forEach(o=>{
      html+=`<div class="booking confirmed">
        <span class="pill pill-green">DELIVERED ✓</span>
        <div class="b-prod">${o.product_name||'-'}</div>
        <div class="b-meta">${o.qty} ${o.qty_type||''}${o.note?' • '+o.note:''}</div>
      </div>`;
    });
  });
  box.innerHTML=html;
}

async function requestPayout(){
  if(!COMMISSION || (COMMISSION.available||0)<=0) return;
  const amt = COMMISSION.available;
  if(!confirm('Request payout of '+_inr(amt)+'?')) return;
  const btn=$('redeem-btn'); if(btn){ btn.disabled=true; btn.innerHTML='<span class="spin"></span>'; }
  try{
    const res = await sbRpc('portal_request_redemption',{p_username:CLIENT.u, p_password:CLIENT.p, p_amount:amt, p_note:null});
    const r = (res&&res.length)?res[0]:null;
    if(r && r.ok){ toast('Payout requested — we will process it'); }
    else { toast((r&&r.message)||'Could not request'); }
    await loadCommission();
    showMyCommission();
  }catch(e){ toast(e.message); if(btn){ btn.disabled=false; } }
}

// "Commission" — referral earnings from clients this client introduced.
function showMyCommission(){
  _activateTab('Commission');
  const box=$('app').querySelector('.content');
  if(!COMMISSION || !COMMISSION.total){ box.innerHTML='<div class="empty">No referral commission yet.</div>'; return; }
  const volDisp = a => a.unit==='pcs' ? (Math.round(a.vol)+' pc') : (Math.round(a.vol)+' kg');
  const paid=COMMISSION.paid||0, avail=COMMISSION.available||0, pending=COMMISSION.pendingExists;
  let html = `<div style="background:var(--surface);border:1px solid var(--green);border-radius:12px;padding:16px;margin-bottom:12px">
      <div style="display:flex;justify-content:space-between;text-align:center">
        <div style="flex:1"><div style="font-size:11px;color:var(--text2)">Earned</div><div style="font-size:18px;font-weight:800;color:var(--text)">${_inr(COMMISSION.total)}</div></div>
        <div style="flex:1;border-left:1px solid var(--border)"><div style="font-size:11px;color:var(--text2)">Paid</div><div style="font-size:18px;font-weight:800;color:var(--text2)">${_inr(paid)}</div></div>
        <div style="flex:1;border-left:1px solid var(--border)"><div style="font-size:11px;color:var(--text2)">Available</div><div style="font-size:18px;font-weight:800;color:var(--green)">${_inr(avail)}</div></div>
      </div>
      <button class="btn" style="width:100%;margin-top:12px" id="redeem-btn" ${(pending||avail<=0)?'disabled':''} onclick="requestPayout()">
        ${pending ? '⏳ Payout requested — pending' : (avail>0 ? '💰 Request payout ('+_inr(avail)+')' : 'Nothing to redeem yet')}
      </button>
    </div>`;
  // redemption history
  if((COMMISSION.redemptions||[]).length){
    const when = ts => { const d=new Date(ts); return isNaN(d)?'':d.toLocaleDateString('en-IN',{day:'numeric',month:'short'}); };
    html += `<div class="group-h">Payout requests</div>`;
    COMMISSION.redemptions.forEach(r=>{
      const pill = r.status==='paid' ? '<span class="pill pill-green">PAID ✓</span>'
                 : r.status==='rejected' ? '<span class="pill pill-red">DECLINED</span>'
                 : '<span class="pill pill-amber">PENDING</span>';
      const amt = r.status==='paid' ? (_inr(parseFloat(r.paid_amount)||parseFloat(r.requested_amount)||0)) : _inr(parseFloat(r.requested_amount)||0);
      html += `<div class="booking ${r.status==='paid'?'confirmed':r.status==='rejected'?'rejected':''}">
        ${pill}
        <div class="b-prod">${amt}</div>
        <div class="b-meta">${when(r.requested_at)}${r.utr?' • UTR '+r.utr:''}${r.status==='paid'&&r.settled_at?' • paid '+when(r.settled_at):''}</div>
      </div>`;
    });
  }
  html += `<div class="group-h" style="margin-top:14px">Earnings breakdown</div>`;
  Object.keys(COMMISSION.byClient).sort().forEach(cl=>{
    const lines = COMMISSION.byClient[cl];
    const sub = lines.reduce((s,a)=>s+a.commission,0);
    html += `<div class="group-h">${cl} — ${_inr(sub)}</div>`;
    lines.sort((a,b)=>b.commission-a.commission).forEach(a=>{
      html += `<div class="prod">
        <div><div class="prod-name">${a.product}</div>
          <div class="prod-sub">${volDisp(a)} • ₹${a.diff}/${a.unit==='pcs'?'pc':'kg'}</div></div>
        <div style="font-weight:800;color:var(--green);font-size:14px">${_inr(a.commission)}</div>
      </div>`;
    });
  });
  html += `<div style="font-size:11px;color:var(--text3);text-align:center;margin-top:12px">Commission on clients you introduced. Figures update as orders are delivered.</div>`;
  box.innerHTML = html;
}

// ── STOCK SHEET (client) ──────────────────────────────────────────────────
// Clean in-stock / out-of-stock sheet, grouped by category, client name on top.
// View on screen + download as PDF (html2pdf loaded on demand).
function _sheetInStock(s){ return s.bundles_avail==null ? (s.free_kg>0) : (s.bundles_avail>0); }

function buildStockSheetEl(){
  const groups={};
  STOCK.forEach(s=>{ const g=s.category||'Other'; (groups[g]=groups[g]||[]).push(s); });
  let blocks='';
  Object.keys(groups).sort().forEach(g=>{
    const items=groups[g].slice().sort((a,b)=>(a.name||'').localeCompare(b.name||'',undefined,{numeric:true}));
    let rows='';
    items.forEach(s=>{
      const inS=_sheetInStock(s);
      const sub=[s.size,s.gsm?s.gsm+'g':'',s.color].filter(Boolean).join(' ');
      const qty = HIDE_STOCK_QTY
                ? (inS ? 'Available' : '—')
                : (!inS ? '—'
                  : (s.bundles_avail!=null ? s.bundles_avail+(s.bundles_avail==1?' bdl':' bdls')
                  : Math.round(s.free_kg)+' kg'));
      rows+=`<div style="display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:2px 0;border-bottom:1px dotted #e3e3e3">
        <span style="font-size:11px;color:#222">${s.name}${sub?` <span style="color:#999;font-size:9px">${sub}</span>`:''}</span>
        <span style="font-size:11px;font-weight:700;white-space:nowrap;color:${inS?'#166534':'#bbb'}">${qty}</span>
      </div>`;
    });
    blocks+=`<div style="break-inside:avoid;margin-bottom:8px">
      <div style="background:#166534;color:#fff;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;padding:3px 7px;border-radius:3px">${g}</div>
      <div style="padding:3px 4px 0">${rows}</div>
    </div>`;
  });
  const today=new Date().toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'});
  const el=document.createElement('div');
  el.style.cssText='width:794px;background:#fff;color:#222;padding:14px 16px;font-family:-apple-system,Segoe UI,Roboto,sans-serif';
  el.innerHTML=`
    <div style="display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid #166534;padding-bottom:6px;margin-bottom:10px">
      <div style="font-size:15px;font-weight:800;color:#166534">${CLIENT.name} — Stock Sheet</div>
      <div style="font-size:11px;color:#555">${today}</div>
    </div>
    <div style="column-count:3;column-width:230px;column-gap:12px">${blocks}</div>
    <div style="margin-top:8px;font-size:8px;color:#888;border-top:1px solid #ddd;padding-top:4px">
      Availability shown is indicative and subject to confirmation. Please place a booking to reserve material.
    </div>`;
  return el;
}

function openStockSheet(){
  if(!STOCK.length){ toast('No stock to show'); return; }
  let ovl=$('sheet-overlay'); if(ovl) ovl.remove();
  ovl=document.createElement('div'); ovl.id='sheet-overlay';
  ovl.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:200;display:flex;flex-direction:column';
  const bar=document.createElement('div');
  bar.style.cssText='display:flex;gap:8px;padding:10px;background:#111;align-items:center;flex-shrink:0';
  bar.innerHTML=`<div style="color:#fff;font-weight:700;font-size:14px;flex:1">Stock Sheet</div>
    <button class="btn" id="sheet-dl" style="padding:8px 14px">⬇ PDF</button>
    <button class="btn btn-ghost" style="padding:8px 14px" onclick="$('sheet-overlay').remove()">✕</button>`;
  const scroll=document.createElement('div');
  scroll.style.cssText='flex:1;overflow:auto;padding:10px;display:flex;justify-content:center;align-items:flex-start';
  const sheet=buildStockSheetEl();
  sheet.style.transformOrigin='top center';
  // scale to fit narrow phone screens while keeping the A4 layout
  const fit=()=>{ const w=scroll.clientWidth-20; sheet.style.transform = w<794 ? `scale(${(w/794).toFixed(3)})` : 'none'; };
  scroll.appendChild(sheet);
  ovl.appendChild(bar); ovl.appendChild(scroll);
  document.body.appendChild(ovl);
  setTimeout(fit,30);
  $('sheet-dl').onclick=()=>downloadStockSheet();
}

function _loadHtml2Pdf(){
  return new Promise((res,rej)=>{
    if(window.html2pdf) return res();
    const sc=document.createElement('script');
    sc.src='https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js';
    sc.onload=()=>res(); sc.onerror=()=>rej(new Error('Could not load PDF library (check internet)'));
    document.head.appendChild(sc);
  });
}

async function downloadStockSheet(){
  const btn=$('sheet-dl'); if(btn){ btn.disabled=true; btn.innerHTML='<span class="spin"></span>'; }
  try{
    await _loadHtml2Pdf();
    const el=buildStockSheetEl();
    const holder=document.createElement('div');
    holder.style.cssText='position:fixed;left:0;top:0;z-index:-1;opacity:0';
    el.style.flex='0 0 auto'; holder.appendChild(el); document.body.appendChild(holder);
    el.offsetHeight; await new Promise(r=>setTimeout(r,250));
    const safe=(CLIENT.name||'Stock').replace(/[^A-Za-z0-9]+/g,'_').replace(/^_+|_+$/g,'');
    const today=new Date().toISOString().split('T')[0];
    try{
      await html2pdf().set({
        margin:0, filename:`Stock_Sheet_${safe}_${today}.pdf`,
        image:{type:'jpeg',quality:0.98},
        html2canvas:{scale:2,useCORS:true,backgroundColor:'#ffffff',width:794,windowWidth:794,scrollX:0,scrollY:0},
        jsPDF:{unit:'mm',format:'a4',orientation:'portrait',compress:true},
        pagebreak:{mode:['css','legacy']}
      }).from(el).save();
    } finally { holder.remove(); }
  }catch(e){ toast(e.message); }
  if(btn){ btn.disabled=false; btn.innerHTML='⬇ PDF'; }
}

restoreSession();
