<style>

    --bg:#0f1411; --surface:#18211c; --surface2:#1f2a23; --surface3:#26332b;

  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}

// REST helpers (anon key). Portal can only touch the safe view, portal_login RPC, and insert bookings.
async function sbGet(path){
  const r = await fetch(`${SB_URL}/rest/v1/${path}`,{headers:{apikey:SB_KEY,Authorization:'Bearer '+SB_KEY}});
  if(!r.ok) throw new Error('Read failed ('+r.status+')');
  return r.json();
}
async function sbRpc(fn, body){
  const r = await fetch(`${SB_URL}/rest/v1/rpc/${fn}`,{method:'POST',headers:{apikey:SB_KEY,Authorization:'Bearer '+SB_KEY,'Content-Type':'application/json'},body:JSON.stringify(body)});
  if(!r.ok){ let t=''; try{ t=await r.text(); }catch(_){}; throw new Error(`${fn} failed (${r.status})${t?': '+t.slice(0,140):''}`); }
  return r.json();
}
async function sbInsert(table, row){
  const r = await fetch(`${SB_URL}/rest/v1/${table}`,{method:'POST',headers:{apikey:SB_KEY,Authorization:'Bearer '+SB_KEY,'Content-Type':'application/json',Prefer:'return=minimal'},body:JSON.stringify(row)});
  if(!r.ok){ const t=await r.text(); throw new Error('Save failed: '+t); }
  return true;
}

// ── Referral commission (for clients who refer others) ────────────────────
// qty → kg / pieces, matching the admin app exactly.
function _cmKg(r){ const q=parseFloat(r.qty)||0, t=(r.qty_type||'bundles').toLowerCase();
  const bw=parseFloat(r.bundle_wt)||0, pw=parseFloat(r.packet_wt)||0, spp=parseFloat(r.sheets_per_packet)||1;
  if(t==='bundles')return q*bw; if(t==='packets')return q*pw; if(t==='sheets')return (q/spp)*pw; if(t==='kg')return q; if(t==='mt')return q*1000; return q*bw; }
function _cmPcs(r){ const q=parseFloat(r.qty)||0, t=(r.qty_type||'bundles').toLowerCase();
  const np=parseFloat(r.num_packets)||1, spp=parseFloat(r.sheets_per_packet)||1, pw=parseFloat(r.packet_wt)||0;
  if(t==='packets'||t==='pcs'||t==='reams')return q; if(t==='bundles')return q*np; if(t==='sheets')return q/spp; if(t==='kg')return pw?q/pw:0; if(t==='mt')return pw?(q*1000)/pw:0; return q*np; }
async function loadCommission(){
  COMMISSION=null;
  let rows=[];
  try{ rows = await sbRpc('portal_my_commission',{p_username:CLIENT.u, p_password:CLIENT.p}) || []; }
  catch(e){ return; }   // RPC not installed yet, or none — simply no tab
  if(!rows.length) return;
  const agg={};
  rows.forEach(r=>{
    const unit = (r.incentive_unit==='pcs') ? 'pcs' : 'kg';
    const vol  = unit==='pcs' ? _cmPcs(r) : _cmKg(r);
    const key  = (r.client_name||'-') + '|' + (r.product_name||'-');
    if(!agg[key]) agg[key] = { client:r.client_name||'-', product:r.product_name||'-', unit, diff:parseFloat(r.diff_rate)||0, cut:parseFloat(r.cut_pct)||0, vol:0 };
    agg[key].vol += (vol||0);
  });
  let total=0; const byClient={};
  Object.values(agg).forEach(a=>{
    const gross=a.diff*a.vol; a.commission=gross*(1-(a.cut||0)/100); total+=a.commission;
    (byClient[a.client]=byClient[a.client]||[]).push(a);
  });
  if(total<=0){ COMMISSION=null; return; }
  // redemption history → paid / pending / available
  let reds=[], paid=0, reserved=0, pendingExists=false;
  try{ reds = await sbRpc('portal_my_redemptions',{p_username:CLIENT.u, p_password:CLIENT.p}) || []; }catch(_){}
  reds.forEach(r=>{
    if(r.status==='paid') paid += (parseFloat(r.paid_amount)||parseFloat(r.requested_amount)||0);
    else if(r.status==='requested'){ reserved += parseFloat(r.requested_amount)||0; pendingExists=true; }
  });
  const available = Math.max(0, total - paid - reserved);
  COMMISSION={ byClient, total, redemptions:reds, paid, available, pendingExists };
}
function _inr(n){ return '₹'+Math.round(n||0).toLocaleString('en-IN'); }

// Restore a saved session on page load / refresh so the client stays logged in.
async function restoreSession(){
  let saved=null;
  try{ saved = JSON.parse(localStorage.getItem('kn_portal_session')||'null'); }catch(_){}
  if(saved && saved.u && saved.p){
    CLIENT = saved;
    try{ await loadStock(); }catch(_){}
    try{ await loadCommission(); }catch(_){}
    try{ await loadContact(); }catch(_){}
    try{ await loadDistData(); }catch(_){}
  }
  render();
}

// Global: hide actual stock numbers from clients (show Available/Not only).
// Later this can be driven per-client from the server.
const HIDE_STOCK_QTY = true;

async function loadStock(){
  try{ STOCK = await sbRpc('portal_stock',{p_username:CLIENT.u, p_password:CLIENT.p}) || []; window._stockErr=''; }
  catch(e){ STOCK=[]; window._stockErr = e.message || 'Unknown error'; toast('Could not load stock'); }
}

function isAvail(s){ return s.bundles_avail==null ? (s.free_kg>0) : (s.bundles_avail>0); }
function qtyLabel(s){
  if(HIDE_STOCK_QTY) return isAvail(s) ? 'Available' : 'Not available';
  if(s.bundles_avail==null) return Math.round(s.free_kg)+' kg';
  return s.bundles_avail>0 ? s.bundles_avail+' bundles' : 'Out of stock';
}

function stockRowsHtml(items){
  const groups={};
  items.forEach(s=>{ const g=s.category||'Other'; (groups[g]=groups[g]||[]).push(s); });
  let list='';
  Object.keys(groups).sort().forEach(g=>{
    list+=`<div class="group-h">${g}</div>`;
    groups[g].forEach(s=>{
      const avail=isAvail(s);
      const sub=[s.size,s.gsm?s.gsm+' GSM':'',s.color].filter(Boolean).join(' • ');
      list+=`<div class="prod ${avail?'':'prod-out'}">
        <div><div class="prod-name">${s.name}</div>
        <div class="prod-sub">${sub||'&nbsp;'}</div>
        <div class="prod-qty">${avail?'✔ Available':'Not available'}</div></div>
        <button class="book-btn" onclick='openBook(${JSON.stringify(s).replace(/'/g,"&#39;")})'>Request</button>
      </div>`;
    });
  });
  return list;
}

function _qtRowData(r){

  const rate=parseFloat(r.querySelector('.qt-rate').value)||0;
  const info=_qtInfo[product.toLowerCase()];

async function _qtRenderPdf(meta, items, fwd, gst){
  const inr=n=>'₹'+Math.round(n).toLocaleString('en-IN');
  const bd='border:1px solid #bbb;padding:7px 9px', bdr=bd+';text-align:right';
  let sub=0; const lines=items.map(r=>{ sub+=r.amt;
    const qtyCell = r.known ? `${r.qty} ${(r.unit||'').toLowerCase()}<br><span style="color:#777;font-size:10px">${Math.round(r.base*100)/100} ${r.baseUnit}</span>` : `${r.qty} ${(r.unit||'').toLowerCase()}`;
    const rateCell = `₹${r.rate}/${r.known?r.baseUnit:(r.unit||'').toLowerCase()}`;
    return `<tr><td style="${bd}">${r.product}</td><td style="${bdr}">${qtyCell}</td><td style="${bdr}">${rateCell}</td><td style="${bdr}">${inr(r.amt)}</td></tr>`; }).join('');
  const taxable=sub+fwd, gstAmt=taxable*gst/100, total=taxable+gstAmt;
  const fmtDate = meta.date? new Date(meta.date).toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'}) : '';
  const inv = meta.docType==='invoice';
  const docTitle = inv?'TAX INVOICE':'QUOTATION';
  const noLabel = inv?'Invoice No':'Quotation No';
  const toLabel = inv?'Bill to':'Quote for';
  const el=document.createElement('div');
  el.style.cssText='width:760px;background:#fff;color:#111;padding:26px;font-family:Arial,Helvetica,sans-serif;box-sizing:border-box';
  el.innerHTML=`
    <div style="display:flex;justify-content:space-between;align-items:flex-start;border-bottom:2px solid #166534;padding-bottom:10px">
      <div style="font-size:21px;font-weight:800;color:#166534">${CLIENT.name||''}</div>
      <div style="text-align:right"><div style="font-size:23px;font-weight:800;color:#777;letter-spacing:1px">${docTitle}</div>
        ${meta.docNo?`<div style="font-size:12px;color:#444;margin-top:2px;font-weight:700">${noLabel}: ${meta.docNo}</div>`:''}</div></div>
    <div style="margin:12px 0;font-size:13px;color:#333;line-height:1.6"><b>${toLabel}:</b> ${meta.cust||'—'}${meta.phone?' · '+meta.phone:''}<br><b>Date:</b> ${fmtDate}</div>
    <table style="width:100%;border-collapse:collapse;font-size:13px">
      <thead><tr><th style="border:1px solid #bbb;padding:7px 9px;background:#f0f7f2;text-align:left">Product</th>
        <th style="border:1px solid #bbb;padding:7px 9px;background:#f0f7f2;text-align:right">Qty</th>
        <th style="border:1px solid #bbb;padding:7px 9px;background:#f0f7f2;text-align:right">Rate</th>
        <th style="border:1px solid #bbb;padding:7px 9px;background:#f0f7f2;text-align:right">Amount</th></tr></thead>
      <tbody>${lines}</tbody></table>
    <div style="margin-top:14px;max-width:300px;margin-left:auto;font-size:13px">
      <div style="display:flex;justify-content:space-between;padding:4px 0"><span>Subtotal</span><span>${inr(sub)}</span></div>
      ${fwd?`<div style="display:flex;justify-content:space-between;padding:4px 0"><span>Forwarding</span><span>${inr(fwd)}</span></div>`:''}
      ${gst?`<div style="display:flex;justify-content:space-between;padding:4px 0"><span>GST ${gst}%</span><span>${inr(gstAmt)}</span></div>`:''}
      <div style="display:flex;justify-content:space-between;font-weight:800;font-size:16px;border-top:2px solid #166534;padding-top:8px;margin-top:4px;color:#166534"><span>Total</span><span>${inr(total)}</span></div>
    </div>`;
  const holder=document.createElement('div');
  holder.style.cssText='position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,.45);overflow:auto;display:flex;justify-content:center;align-items:flex-start;padding:10px';
  holder.appendChild(el); document.body.appendChild(holder);
  try{
    await _loadH2P();
    el.offsetHeight; await new Promise(r=>setTimeout(r,350));
    await html2pdf().set({ margin:8, filename:(inv?'Invoice':'Quotation')+(meta.docNo?'-'+meta.docNo:'')+'.pdf', image:{type:'jpeg',quality:0.96},
      html2canvas:{scale:2,useCORS:true,backgroundColor:'#ffffff',x:0,y:0,scrollX:0,scrollY:0,width:760,windowWidth:760},
      jsPDF:{unit:'mm',format:'a4',orientation:'portrait',compress:true} }).from(el).save();
  }catch(e){ toast('Could not build PDF — check your connection'); }
  finally{ holder.remove(); }
}
async function qtGeneratePdf(){
  const rows=_qtRows().filter(r=>r.product && r.qty>0 && r.rate>0);
  if(!rows.length){ toast('Add at least one item with product, qty and rate'); return; }
  const inv=_qtMode==='invoice';
  // Invoices run a real sequential series (1, 2, 3 …); quotes get the random climbing number.
  let docNo;
  if(inv){ const nos=(_qtSavedList||[]).map(d=>parseInt(d.invoice_no)||0); docNo=(nos.length?Math.max.apply(null,nos):0)+1; }
  else { docNo=_qtNextNo(_qtSavedList, 'quote_no'); }
  const meta={ cust:($('qt-cust').value||'').trim()||'—', phone:($('qt-phone').value||'').trim(), date:$('qt-date').value||'', docType:_qtMode, docNo };
  const fwd=parseFloat($('qt-fwd').value)||0, gst=parseFloat($('qt-gst').value)||0;
  const items=rows.map(r=>({product:r.product,qty:r.qty,unit:r.unit,rate:r.rate,known:r.known,base:r.base,baseUnit:r.baseUnit,amt:r.amt}));
  const sub=items.reduce((s,r)=>s+r.amt,0), gstAmt=(sub+fwd)*gst/100, total=sub+fwd+gstAmt;
  const btn=$('qt-dl'); if(btn){ btn.disabled=true; btn.innerHTML='<span class="spin"></span> Preparing...'; }
  await _qtRenderPdf(meta, items, fwd, gst);
  let saveErr=null;
  try{
    if(inv){ await sbRpc('portal_save_invoice',{p_username:CLIENT.u,p_password:CLIENT.p,
      p_bill_to:meta.cust,p_phone:meta.phone,p_date:meta.date,p_items:items,
      p_subtotal:sub,p_forwarding:fwd,p_gst_pct:gst,p_gst_total:gstAmt,p_total:total,p_invoice_no:docNo}); }
    else { await sbRpc('portal_save_quote',{p_username:CLIENT.u,p_password:CLIENT.p,
      p_quote_for:meta.cust,p_phone:meta.phone,p_date:meta.date,p_items:items,
      p_subtotal:sub,p_forwarding:fwd,p_gst_pct:gst,p_gst_total:gstAmt,p_total:total,p_quote_no:docNo}); }
  }catch(e){ saveErr=e; }
  if(btn){ btn.disabled=false; btn.innerHTML = inv?'📄 Download &amp; save invoice':'📄 Download &amp; save quote'; }
  if(saveErr){ toast('Downloaded, but could not save: '+(saveErr.message||'try again')); return; }
  toast((inv?'Invoice':'Quote')+' #'+docNo+' saved');
  qtLoadSaved();
  qtResetForm();   // auto-start a fresh document
}
function qtResetForm(){
  if($('qt-cust')) $('qt-cust').value='';
  if($('qt-phone')) $('qt-phone').value='';
  if($('qt-fwd')) $('qt-fwd').value='0';
  if($('qt-gst')) $('qt-gst').value='0';
  if($('qt-date')) $('qt-date').value=new Date().toISOString().split('T')[0];
  const wrap=$('qt-items'); if(wrap) wrap.innerHTML='';
  qtAddRow(); qtRecalc();
  try{ window.scrollTo({top:0,behavior:'smooth'}); }catch(_){}
}
async function qtLoadSaved(){
  const el=$('qt-saved'); if(!el) return;
  const inv=_qtMode==='invoice';
  let rows=[]; try{ rows=await sbRpc(inv?'portal_my_invoices':'portal_my_quotes',{p_username:CLIENT.u,p_password:CLIENT.p})||[]; }catch(_){ el.innerHTML='<div class="empty">Nothing saved yet.</div>'; return; }
  _qtSavedList=rows;
  if(!rows.length){ el.innerHTML='<div class="empty">'+(inv?'No invoices yet.':'No saved quotes yet.')+'</div>'; return; }
  const fmt=d=>{ if(!d)return''; const t=new Date(d); return isNaN(t)?d:t.toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'}); };
  window._qtSaved={};
  el.innerHTML=rows.map(q=>{ window._qtSaved[q.id]=q; const no=inv?q.invoice_no:q.quote_no; const to=inv?q.bill_to:q.quote_for; const dt=inv?q.inv_date:q.qt_date;
    return `<div class="booking confirmed"><span class="pill pill-green">${_inr(q.total||0)}</span>
      <div class="b-prod">${no?('#'+no+' · '):''}${to||'—'}</div>
      <div class="b-meta">${fmt(dt||q.created_at)} · ${(q.items||[]).length} item(s)</div>
      <button class="btn btn-ghost" style="margin-top:8px;width:100%" onclick="qtDownloadSaved('${q.id}')">📄 Download again</button></div>`; }).join('');
}
async function qtDownloadSaved(id){
  const q=(window._qtSaved||{})[id]; if(!q){ toast('Not found'); return; }
  const inv=_qtMode==='invoice';
  const meta={ cust:(inv?q.bill_to:q.quote_for)||'—', phone:q.customer_phone||'', date:(inv?q.inv_date:q.qt_date)||q.created_at||'', docType:_qtMode, docNo:(inv?q.invoice_no:q.quote_no) };
  await _qtRenderPdf(meta, q.items||[], parseFloat(q.forwarding)||0, parseFloat(q.gst_pct)||0);
}

async function ppRenderList(){

    const specs=[ (p.incentive_unit==='pcs'?'Pieces':'Weight'),
      p.bundle_wt?`${p.bundle_wt} kg/bundle`:'', p.num_packets?`${p.num_packets} pkts`:'',
      p.sheets_per_packet?`${p.sheets_per_packet} sh/pkt`:'', p.packet_wt?`${p.packet_wt} kg/pkt`:'' ].filter(Boolean).join(' · ');
    return `<div class="booking"><span class="pill" style="background:var(--surface3);color:var(--text2);cursor:pointer" onclick="ppDel('${(p.name||'').replace(/'/g,"\\'")}')">✕ Remove</span>

async function ppSave(){
  const name=($('pp-name').value||'').trim(); if(!name){ toast('Enter a product name'); return; }
  const payload={ p_username:CLIENT.u, p_password:CLIENT.p, p_name:name,
    p_unit:$('pp-unit').value||'kg',
    p_bundle_wt:($('pp-bw').value||'').trim()||null, p_packet_wt:($('pp-pw').value||'').trim()||null,
    p_num_packets:($('pp-np').value||'').trim()||null, p_sheets_per_packet:($('pp-spp').value||'').trim()||null };
  const btn=$('pp-btn'); if(btn){ btn.disabled=true; btn.innerHTML='<span class="spin"></span>'; }
  try{ await sbRpc('portal_add_my_product',payload);
    ['pp-name','pp-bw','pp-pw','pp-np','pp-spp'].forEach(i=>{ if($(i))$(i).value=''; });
    toast('Product saved'); await ppRenderList(); }
  catch(e){ toast(e.message); }
  if(btn){ btn.disabled=false; btn.textContent='+ Save product'; }
}
async function ppDel(name){
  if(!name) return;
  try{ await sbRpc('portal_del_my_product',{p_username:CLIENT.u,p_password:CLIENT.p,p_name:name}); ppRenderList(); }
  catch(e){ toast(e.message); }
}

let _drRows=[], _drFrom='', _drTo='';
function _drIso(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function _drSetPeriod(p){
  const now=new Date(); let from, to=_drIso(now);
  if(p==='day'){ from=_drIso(now); }
  else if(p==='week'){ const day=(now.getDay()+6)%7; const mon=new Date(now); mon.setDate(now.getDate()-day); from=_drIso(mon); }
  else if(p==='month'){ from=_drIso(new Date(now.getFullYear(),now.getMonth(),1)); }
  else { return; }   // custom: leave the inputs as they are
  if($('dr-from')) $('dr-from').value=from;
  if($('dr-to')) $('dr-to').value=to;
  loadDistReport();
}
function _drCustom(){ const sel=$('dr-period'); if(sel) sel.value='custom'; loadDistReport(); }
function _drUsh(u){ u=(u||'').toLowerCase(); return u==='bundles'?'bdl':u==='packets'?'pkt':u==='sheets'?'sh':u==='reams'?'rm':u==='pcs'?'pc':u; }
function _drAgg(rows){
  const cats={};
  (rows||[]).forEach(r=>{ const c=r.category||'Uncategorised'; if(!cats[c]) cats[c]={totals:{},lines:[]};
    const u=(r.qty_type||'').toLowerCase(), q=parseFloat(r.qty)||0;
    cats[c].totals[u]=(cats[c].totals[u]||0)+q;
    cats[c].lines.push({name:r.product_name||'-',qty:q,unit:u,client:r.end_client_name||''}); });
  return cats;
}
async function loadDistReport(){
  const from=($('dr-from')||{}).value, to=($('dr-to')||{}).value; if(!from||!to){ return; }
  _drFrom=from; _drTo=to;

  catch(e){ out.innerHTML='<div class="empty">'+(e.message||'Could not load report')+'</div>'; return; }
  _drRows=rows;
  if(!rows.length){ out.innerHTML='<div class="empty">No distributions on this day.</div>'; return; }
  const cats=_drAgg(rows);
  out.innerHTML=Object.keys(cats).sort().map(c=>{
    const t=cats[c]; const tot=Object.keys(t.totals).map(u=>`${Math.round(t.totals[u]*100)/100} ${_drUsh(u)}`).join(' · ');
    return `<div class="dcard"><div class="dcard-h"><span class="dcard-name">${c}</span><span class="dbadge">${tot}</span></div>
      ${t.lines.map(l=>`<div class="dc-line"><span class="nm">${l.name}${l.client?(' → '+l.client):''}</span><span class="q">${l.qty} ${_drUsh(l.unit)}</span></div>`).join('')}</div>`;
  }).join('');
}

// What this reseller owes their clients' mechanics/referrers on approved resale distributions.
async function loadMechDues(){
  const el=$('ds-dues'); if(!el) return;
  let rows=[];
  try{ rows = await sbRpc('portal_mechanic_dues',{p_username:CLIENT.u,p_password:CLIENT.p}) || []; }catch(_){ el.innerHTML=''; return; }
  if(!rows.length){ el.innerHTML=''; return; }
  const agg={}; let total=0;
  rows.forEach(r=>{
    const unit=(r.incentive_unit==='pcs')?'pcs':'kg';

    <div style="background:rgba(245,158,11,.12);border:1px solid var(--amber);border-radius:12px;padding:14px;margin-bottom:14px">
      <div style="font-weight:700;margin-bottom:2px">You owe your clients' mechanics</div>

        <span style="font-size:11px;font-weight:700;white-space:nowrap;color:${inS?'#166534':'#bbb'}">${qty}</span>
      </div>`;
    });
    blocks+=`<div style="break-inside:avoid;margin-bottom:8px">
      <div style="background:#166534;color:#fff;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;padding:3px 7px;border-radius:3px">${g}</div>
      <div style="padding:3px 4px 0">${rows}</div>
    </div>`;
  });
  const today=new Date().toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'});
  const el=document.createElement('div');
  el.style.cssText='width:794px;background:#fff;color:#222;padding:14px 16px;font-family:-apple-system,Segoe UI,Roboto,sans-serif';
  el.innerHTML=`
    <div style="display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid #166534;padding-bottom:6px;margin-bottom:10px">
      <div style="font-size:15px;font-weight:800;color:#166534">${CLIENT.name} — Stock Sheet</div>
      <div style="font-size:11px;color:#555">${today}</div>
    </div>
    <div style="column-count:3;column-width:230px;column-gap:12px">${blocks}</div>
    <div style="margin-top:8px;font-size:8px;color:#888;border-top:1px solid #ddd;padding-top:4px">
      Availability shown is indicative and subject to confirmation. Please place a booking to reserve material.
    </div>`;
  return el;
}

function openStockSheet(){
  if(!STOCK.length){ toast('No stock to show'); return; }
  let ovl=$('sheet-overlay'); if(ovl) ovl.remove();
  ovl=document.createElement('div'); ovl.id='sheet-overlay';
  ovl.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:200;display:flex;flex-direction:column';
  const bar=document.createElement('div');
  bar.style.cssText='display:flex;gap:8px;padding:10px;background:#111;align-items:center;flex-shrink:0';
  bar.innerHTML=`<div style="color:#fff;font-weight:700;font-size:14px;flex:1">Stock Sheet</div>
    <button class="btn" id="sheet-dl" style="padding:8px 14px">⬇ PDF</button>
    <button class="btn btn-ghost" style="padding:8px 14px" onclick="$('sheet-overlay').remove()">✕</button>`;
  const scroll=document.createElement('div');
  scroll.style.cssText='flex:1;overflow:auto;padding:10px;display:flex;justify-content:center;align-items:flex-start';
  const sheet=buildStockSheetEl();
  sheet.style.transformOrigin='top center';
  // scale to fit narrow phone screens while keeping the A4 layout
  const fit=()=>{ const w=scroll.clientWidth-20; sheet.style.transform = w<794 ? `scale(${(w/794).toFixed(3)})` : 'none'; };
  scroll.appendChild(sheet);
  ovl.appendChild(bar); ovl.appendChild(scroll);
  document.body.appendChild(ovl);
  setTimeout(fit,30);
  $('sheet-dl').onclick=()=>downloadStockSheet();
}

function _loadHtml2Pdf(){
  return new Promise((res,rej)=>{
    if(window.html2pdf) return res();
    const sc=document.createElement('script');
    sc.src='https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js';
    sc.onload=()=>res(); sc.onerror=()=>rej(new Error('Could not load PDF library (check internet)'));
    document.head.appendChild(sc);
  });
}

async function downloadStockSheet(){
  const btn=$('sheet-dl'); if(btn){ btn.disabled=true; btn.innerHTML='<span class="spin"></span>'; }
  try{
    await _loadHtml2Pdf();
    const el=buildStockSheetEl();
    const holder=document.createElement('div');
    holder.style.cssText='position:fixed;left:0;top:0;z-index:-1;opacity:0';
    el.style.flex='0 0 auto'; holder.appendChild(el); document.body.appendChild(holder);
    el.offsetHeight; await new Promise(r=>setTimeout(r,250));
    const safe=(CLIENT.name||'Stock').replace(/[^A-Za-z0-9]+/g,'_').replace(/^_+|_+$/g,'');
    const today=new Date().toISOString().split('T')[0];
    try{
      await html2pdf().set({
        margin:0, filename:`Stock_Sheet_${safe}_${today}.pdf`,
        image:{type:'jpeg',quality:0.98},
        html2canvas:{scale:2,useCORS:true,backgroundColor:'#ffffff',width:794,windowWidth:794,scrollX:0,scrollY:0},
        jsPDF:{unit:'mm',format:'a4',orientation:'portrait',compress:true},
        pagebreak:{mode:['css','legacy']}
      }).from(el).save();
    } finally { holder.remove(); }
  }catch(e){ toast(e.message); }
  if(btn){ btn.disabled=false; btn.innerHTML='⬇ PDF'; }
}

restoreSession();
</script>
</body>
