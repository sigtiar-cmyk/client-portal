<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>SHRI K N PAPERS — Client Portal</title>
<style>
  :root{
    --bg:#0f1411; --surface:#18211c; --surface2:#1f2a23; --surface3:#26332b;
    --border:#2c3a31; --text:#e8efe9; --text2:#aab8af; --text3:#6f7d74;
    --green:#22c55e; --accent:#166534; --red:#ef4444; --amber:#d97706;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
  .wrap{max-width:520px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
  .topbar{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--bg);z-index:20}
  .brand{font-weight:800;font-size:16px;letter-spacing:.5px}
  .brand span{color:var(--green)}
  .who{font-size:12px;color:var(--text2);display:flex;align-items:center;gap:6px}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--green)}
  .login{flex:1;display:flex;flex-direction:column;justify-content:center;padding:30px 24px;gap:14px}
  .login h1{font-size:22px;font-weight:800}
  .login h1 span{color:var(--green)}
  .login p{color:var(--text2);font-size:13px;line-height:1.5;margin-bottom:6px}
  label{font-size:12px;color:var(--text2);font-weight:600;display:block;margin-bottom:5px}
  input,select{width:100%;padding:12px 14px;background:var(--surface2);border:1px solid var(--border);border-radius:10px;color:var(--text);font-size:15px;outline:none}
  input:focus,select:focus{border-color:var(--green)}
  .btn{padding:12px 16px;border:none;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;background:var(--accent);color:#fff}
  .btn:active{transform:scale(.98)}
  .btn:disabled{opacity:.6}
  .btn-ghost{background:var(--surface2);color:var(--text);border:1px solid var(--border)}
  .tabs{display:flex;border-bottom:1px solid var(--border);position:sticky;top:53px;background:var(--bg);z-index:10}
  .tab{flex:1;text-align:center;padding:12px;font-size:13px;font-weight:700;color:var(--text3);cursor:pointer;border-bottom:2px solid transparent}
  .tab.on{color:var(--green);border-bottom-color:var(--green)}
  .content{flex:1;padding:14px 14px 90px}
  .group-h{font-size:11px;font-weight:800;color:var(--green);text-transform:uppercase;letter-spacing:1px;margin:14px 4px 6px}
  .prod{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 14px;margin-bottom:8px;display:flex;align-items:center;justify-content:space-between;gap:10px}
  .prod-name{font-weight:700;font-size:14px}
  .prod-sub{font-size:11px;color:var(--text3);margin-top:2px}
  .prod-qty{font-size:12px;color:var(--green);font-weight:700;margin-top:3px}
  .prod-out .prod-qty{color:var(--text3)}
  .book-btn{background:var(--accent);color:#fff;border:none;border-radius:8px;padding:8px 14px;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap}
  .book-btn:disabled{background:var(--surface3);color:var(--text3)}
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:flex-end;justify-content:center;z-index:50}
  .overlay.show{display:flex}
  .sheet{background:var(--surface);width:100%;max-width:520px;border-radius:16px 16px 0 0;padding:18px 18px 26px}
  .sheet h3{font-size:16px;margin-bottom:4px}
  .sheet .muted{font-size:12px;color:var(--text2);margin-bottom:14px}
  .row{display:flex;gap:10px;margin-bottom:12px}.row>div{flex:1}
  .booking{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 14px;margin-bottom:8px;border-left:3px solid var(--amber)}
  .booking.confirmed{border-left-color:var(--green)}
  .booking.rejected{border-left-color:var(--red);opacity:.7}
  .b-prod{font-weight:700;font-size:14px}
  .b-meta{font-size:11px;color:var(--text3);margin-top:3px}
  .pill{font-size:10px;font-weight:700;padding:2px 8px;border-radius:10px;white-space:nowrap;float:right}
  .pill-amber{background:rgba(217,119,6,.15);color:var(--amber)}
  .pill-green{background:rgba(34,197,94,.15);color:var(--green)}
  .pill-red{background:rgba(239,68,68,.15);color:var(--red)}
  .empty{text-align:center;color:var(--text3);padding:40px 20px;font-size:13px}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--accent);color:#fff;padding:11px 18px;border-radius:10px;font-size:13px;font-weight:600;z-index:99;opacity:0;transition:opacity .25s;pointer-events:none;text-align:center;max-width:90%}
  .toast.show{opacity:1}
  .spin{display:inline-block;width:16px;height:16px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite;vertical-align:middle}
  @keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div class="toast" id="toast"></div>

<div class="overlay" id="book-overlay">
  <div class="sheet">
    <h3 id="bk-title">Book material</h3>
    <div class="muted" id="bk-avail"></div>
    <div class="row">
      <div><label>Quantity</label><input id="bk-qty" type="text" inputmode="decimal" placeholder="0"/></div>
      <div><label>Unit</label><select id="bk-unit"><option>Bundles</option><option>Packets</option></select></div>
    </div>
    <label>Note (optional)</label>
    <input id="bk-note" placeholder="Any special instruction"/>
    <div style="display:flex;gap:10px;margin-top:16px">
      <button class="btn btn-ghost" style="flex:1" onclick="closeBook()">Cancel</button>
      <button class="btn" style="flex:1" id="bk-confirm" onclick="confirmBook()">Place booking</button>
    </div>
  </div>
</div>

<script>
const SB_URL = 'https://xyiqlrqymmiiarckywqs.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inh5aXFscnF5bW1paWFyY2t5d3FzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg2MDM1OTMsImV4cCI6MjA5NDE3OTU5M30.Vxb1iDn_ecw9w7OA04royIuzXFSjOWD5M3KnHiNRPCo';

const $ = id => document.getElementById(id);
function toast(m){ const t=$('toast'); t.textContent=m; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2600); }

// REST helpers (anon key). Portal can only touch the safe view, portal_login RPC, and insert bookings.
async function sbGet(path){
  const r = await fetch(`${SB_URL}/rest/v1/${path}`,{headers:{apikey:SB_KEY,Authorization:'Bearer '+SB_KEY}});
  if(!r.ok) throw new Error('Read failed ('+r.status+')');
  return r.json();
}
async function sbRpc(fn, body){
  const r = await fetch(`${SB_URL}/rest/v1/rpc/${fn}`,{method:'POST',headers:{apikey:SB_KEY,Authorization:'Bearer '+SB_KEY,'Content-Type':'application/json'},body:JSON.stringify(body)});
  if(!r.ok) throw new Error('Login failed ('+r.status+')');
  return r.json();
}
async function sbInsert(table, row){
  const r = await fetch(`${SB_URL}/rest/v1/${table}`,{method:'POST',headers:{apikey:SB_KEY,Authorization:'Bearer '+SB_KEY,'Content-Type':'application/json',Prefer:'return=minimal'},body:JSON.stringify(row)});
  if(!r.ok){ const t=await r.text(); throw new Error('Save failed: '+t); }
  return true;
}

let CLIENT = null;
let STOCK = [];
let bookingTarget = null;

function render(){ CLIENT ? renderStock() : renderLogin(); }

function renderLogin(){
  $('app').innerHTML = `
    <div class="topbar"><div class="brand">SHRI <span>K N</span> PAPERS</div></div>
    <div class="login">
      <h1>Client <span>Portal</span></h1>
      <p>Sign in to see available stock and book material. Your booking reaches us directly.</p>
      <div><label>Username</label><input id="lg-user" placeholder="username" autocomplete="off"/></div>
      <div><label>Password</label><input id="lg-pass" type="password" placeholder="••••" onkeydown="if(event.key==='Enter')doLogin()"/></div>
      <button class="btn" id="lg-btn" onclick="doLogin()">Sign in</button>
    </div>`;
}

async function doLogin(){
  const u=($('lg-user').value||'').trim(), p=($('lg-pass').value||'').trim();
  if(!u||!p){ toast('Enter username and password'); return; }
  const btn=$('lg-btn'); btn.disabled=true; btn.innerHTML='<span class="spin"></span>';
  try{
    const res = await sbRpc('portal_login',{p_username:u, p_password:p});
    if(!res || !res.length){ toast('Wrong username or password'); btn.disabled=false; btn.textContent='Sign in'; return; }
    CLIENT = { id:res[0].customer_id, name:res[0].customer_name, u, p };
    await loadStock();
    render();
  }catch(e){ toast(e.message); btn.disabled=false; btn.textContent='Sign in'; }
}
function logout(){ CLIENT=null; STOCK=[]; render(); }

async function loadStock(){
  try{ STOCK = await sbGet('client_stock_view?order=category.asc,name.asc'); }
  catch(e){ STOCK=[]; toast('Could not load stock'); }
}

function qtyLabel(s){
  if(s.bundles_avail==null) return Math.round(s.free_kg)+' kg';
  return s.bundles_avail>0 ? s.bundles_avail+' bundles' : 'Out of stock';
}

function renderStock(){
  const groups={};
  STOCK.forEach(s=>{ const g=s.category||'Other'; (groups[g]=groups[g]||[]).push(s); });
  let list='';
  Object.keys(groups).sort().forEach(g=>{
    list+=`<div class="group-h">${g}</div>`;
    groups[g].forEach(s=>{
      const avail = s.bundles_avail==null ? (s.free_kg>0) : (s.bundles_avail>0);
      const sub=[s.size,s.gsm?s.gsm+' GSM':'',s.color].filter(Boolean).join(' • ');
      list+=`<div class="prod ${avail?'':'prod-out'}">
        <div><div class="prod-name">${s.name}</div>
        <div class="prod-sub">${sub||'&nbsp;'}</div>
        <div class="prod-qty">${avail?'Available: '+qtyLabel(s):'Out of stock'}</div></div>
        <button class="book-btn" ${avail?'':'disabled'} onclick='openBook(${JSON.stringify(s).replace(/'/g,"&#39;")})'>${avail?'Book':'—'}</button>
      </div>`;
    });
  });
  $('app').innerHTML=`
    <div class="topbar">
      <div class="brand" style="max-width:65%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${CLIENT.name}</div>
      <div class="who"><span class="dot"></span><span onclick="logout()" style="color:var(--green);cursor:pointer;font-weight:600">Log out</span></div>
    </div>
    <div class="tabs">
      <div class="tab on" onclick="renderStock()">Available Stock</div>
      <div class="tab" onclick="showMyBookings()">My Bookings</div>
    </div>
    <div class="content">
      <input style="margin-bottom:12px" placeholder="🔍 Search material..." oninput="filterStock(this.value)"/>
      <div id="stock-list">${list||'<div class="empty">No stock available right now.</div>'}</div>
    </div>`;
}

function filterStock(q){
  q=(q||'').toLowerCase();
  const groups={};
  STOCK.filter(s=>!q||((s.name||'')+(s.category||'')+(s.size||'')+(s.color||'')).toLowerCase().includes(q))
    .forEach(s=>{const g=s.category||'Other';(groups[g]=groups[g]||[]).push(s);});
  let list='';
  Object.keys(groups).sort().forEach(g=>{
    list+=`<div class="group-h">${g}</div>`;
    groups[g].forEach(s=>{
      const avail = s.bundles_avail==null ? (s.free_kg>0) : (s.bundles_avail>0);
      const sub=[s.size,s.gsm?s.gsm+' GSM':'',s.color].filter(Boolean).join(' • ');
      list+=`<div class="prod ${avail?'':'prod-out'}"><div><div class="prod-name">${s.name}</div><div class="prod-sub">${sub||'&nbsp;'}</div><div class="prod-qty">${avail?'Available: '+qtyLabel(s):'Out of stock'}</div></div><button class="book-btn" ${avail?'':'disabled'} onclick='openBook(${JSON.stringify(s).replace(/'/g,"&#39;")})'>${avail?'Book':'—'}</button></div>`;
    });
  });
  const el=$('stock-list'); if(el) el.innerHTML=list||'<div class="empty">No matching material.</div>';
}

function openBook(s){
  bookingTarget=s;
  $('bk-title').textContent='Book '+s.name;
  $('bk-avail').textContent='Available: '+qtyLabel(s);
  $('bk-qty').value=''; $('bk-note').value=''; $('bk-unit').value='Bundles';
  $('book-overlay').classList.add('show');
}
function closeBook(){ $('book-overlay').classList.remove('show'); }

async function confirmBook(){
  const qty=parseFloat($('bk-qty').value);
  if(!qty||qty<=0){ toast('Enter a quantity'); return; }
  const btn=$('bk-confirm'); btn.disabled=true; btn.innerHTML='<span class="spin"></span>';
  try{
    await sbInsert('bookings',{
      customer_id:CLIENT.id, customer_name:CLIENT.name,
      product_id:bookingTarget.product_id, product_name:bookingTarget.name,
      qty, qty_type:$('bk-unit').value.toLowerCase(),
      note:($('bk-note').value||'').trim()||null, status:'new'
    });
    closeBook();
    toast('Booking placed — we have been notified');
  }catch(e){ toast(e.message); }
  btn.disabled=false; btn.textContent='Place booking';
}

// "My Bookings" — fetched through the portal_my_bookings RPC, which re-checks
// the client's own credentials server-side and returns ONLY their bookings.
async function showMyBookings(){
  const tabs=$('app').querySelectorAll('.tab');
  tabs[0].classList.remove('on'); tabs[1].classList.add('on');
  const box=$('app').querySelector('.content');
  box.innerHTML='<div class="empty"><span class="spin" style="border-top-color:var(--green)"></span></div>';
  let rows=[];
  try{ rows = await sbRpc('portal_my_bookings',{p_username:CLIENT.u, p_password:CLIENT.p}) || []; }
  catch(e){ box.innerHTML='<div class="empty">Could not load your bookings.<br>Please try again.</div>'; return; }
  if(!rows.length){ box.innerHTML='<div class="empty">No bookings yet.<br><br>Book material from the Available Stock tab — it reaches us instantly.</div>'; return; }
  const pill = s =>
    s==='confirmed' ? '<span class="pill pill-green">CONFIRMED ✓</span>' :
    s==='rejected'  ? '<span class="pill pill-red">NOT AVAILABLE</span>' :
                      '<span class="pill pill-amber">WAITING</span>';
  const when = ts => { const d=new Date(ts); return d.toLocaleDateString('en-IN',{day:'numeric',month:'short'})+', '+d.toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'}); };
  box.innerHTML = rows.map(b=>`
    <div class="booking ${b.status==='confirmed'?'confirmed':b.status==='rejected'?'rejected':''}">
      ${pill(b.status)}
      <div class="b-prod">${b.product_name||'-'}</div>
      <div class="b-meta">${b.qty} ${b.qty_type||''} • ${when(b.created_at)}${b.note?' • '+b.note:''}</div>
    </div>`).join('');
}

render();
</script>
</body>
</html>
